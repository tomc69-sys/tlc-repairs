<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" preserveAspectRatio="xMidYMid slice" width="3840" height="2160">
  <defs>
    <linearGradient id="haze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070707"/>
      <stop offset="0.45" stop-color="#101010"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="fog" cx="32%" cy="42%" r="58%">
      <stop offset="0" stop-color="#0d1a10" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="green" x1="0" y1="1" x2="1" y2="0">
