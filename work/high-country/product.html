<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Product | High Country Supply</title>
  <link rel="stylesheet" href="../demo-bar.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <p class="demo-bar">Sample shop · cart works, no real payment · <a href="../../websites.html">Back to TLC website work</a></p>
  <header class="site-head">
    <div class="wrap">
      <a class="brand" href="./">
        <strong>High Country Supply</strong>
        <em>Goods for the road</em>
      </a>
      <nav>
        <a href="./">Home</a>
        <a href="./shop.html">Shop</a>
        <a href="./checkout.html">Checkout</a>
        <button class="cart-btn" type="button" data-open-cart>Cart <b data-cart-count>0</b></button>
      </nav>
    </div>
  </header>
  <main>
    <section>
      <div class="wrap layout" data-product></div>
    </section>
  </main>
  <button class="backdrop" data-cart-backdrop data-close-cart type="button" aria-label="Close cart"></button>
  <aside class="drawer" data-cart-drawer aria-label="Cart">
    <p><strong>Cart</strong> · <button class="btn ghost" data-close-cart type="button">Close</button></p>
    <div data-cart-list></div>
  </aside>
  <footer>
    <div class="wrap">High Country Supply is a sample store for TLC web design.</div>
  </footer>
  <script src="./shop.js"></script>
</body>
</html>
